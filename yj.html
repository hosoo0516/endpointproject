<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>상품 리뷰</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <!-- 1. 리뷰 작성 영역 (위쪽 박스) -->
      <section class="review-form-section">
        <h2>리뷰 작성</h2>
        <form id="review-form">
          <div class="form-row">
            <!-- 평점 선택 -->
            <div class="form-group rating-group">
              <label for="rating">평점</label>
              <select id="rating" name="rating" required>
                <option value="" disabled selected>별점을 선택해주세요</option>
                <option value="5">★★★★★ (5점)</option>
                <option value="4">★★★★☆ (4점)</option>
                <option value="3">★★★☆☆ (3점)</option>
                <option value="2">★★☆☆☆ (2점)</option>
                <option value="1">★☆☆☆☆ (1점)</option>
              </select>
            </div>

            <!-- 작성자 입력창 -->
            <div class="form-group author-group">
              <label for="author">작성자</label>
              <input
                type="text"
                id="author"
                placeholder="작성자 이름"
                required
              />
            </div>
          </div>

          <!-- 리뷰 내용 입력창 -->
          <div class="form-group content-group">
            <label for="content">리뷰 내용</label>
            <input
              type="text"
              id="content"
              placeholder="솔직한 리뷰를 작성해주세요"
              required
            />
          </div>

          <!-- 등록 버튼 -->
          <div class="form-btn-group">
            <button type="submit" id="submit-review-btn">리뷰 등록</button>
          </div>
        </form>
      </section>

      <!-- 2. 구매자 리뷰 목록 영역 (아래쪽 박스 - 딱 1개만 유지) -->
      <section class="review-list-section">
        <h2>구매자 리뷰 목록</h2>
        <div id="review-list-container">
          <!-- JS에서 카드들이 동적으로 들어가는 곳 -->
        </div>
      </section>
    </main>

    <!-- 스크립트 연결 -->
    <script src="js/review.js"></script>
  </body>
</html>
