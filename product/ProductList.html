<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>상품 목록</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>상품 목록</h1>
      <div class="filter-box">
        <select id="category-select">
          <option value="">전체 카테고리</option>
          <option value="전자기기">전자기기</option>
          <option value="도서/음반">도서/음반</option>
          <option value="생활/주방">생활/주방</option>
          <option value="패션/의류">패션/의류</option>
          <option value="뷰티/화장품">뷰티/화장품</option>
        </select>
        <input
          type="text"
          id="keyword-input"
          placeholder="검색할 상품명을 입력하세요"
        />
        <button id="search-btn">검색</button>
      </div>
      <div id="product-container" class="product-grid"></div>
    </div>

    <script src="../js/productList.js"></script>
  </body>
</html>
